<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو | الوطنية للمشويات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خطوط جوجل (كايرو) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
        }
        /* إخفاء شريط التمرير (Scrollbar) من شريط الأقسام */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="antialiased">

    <!-- المكان اللي هيتعرض فيه الموقع -->
    <div id="root"></div>

    <!-- كود الموقع (React داخل HTML) -->
    <script type="text/babel">
        const { useState } = React;

        const MenuApp = () => {
            const [activeCategory, setActiveCategory] = useState('السلطات');

            const menuData = {
                'السلطات': [
                    { name: 'سلطه خضراء', price: '٢٠' },
                    { name: 'ثوميه / بابا غنوج / زبادي', price: '٢٠' },
                    { name: 'كول سلو / حمص / مايونيز', price: '٢٥' },
                    { name: 'طبق ميكس صغير', price: '٣٠' },
                    { name: 'طبق ميكس كبير', price: '٤٠' },
                    { name: 'جبنه قديمه', price: '٣٠' },
                ],
                'النشويات': [
                    { name: 'أرز بسمتي / أرز كاري', price: '٧٠' },
                    { name: 'أرز بالخلطه / فته ساده', price: '٦٥' },
                    { name: 'أرز ساده', price: '٥٥' },
                    { name: 'برام أرز معمر', price: '٧٠' },
                    { name: 'سوبر (أرز ومحاشي وجلاش)', price: '٩٠' },
                ],
                'المكرونات': [
                    { name: 'مبكبكه لحمه', price: '٢٢٥' },
                    { name: 'مبكبكه سجق', price: '١٨٥' },
                    { name: 'مكرونه وايت صوص + بانيه', price: '٢٥٠' },
                    { name: 'طبق فراخ بانيه (مع أرز ومحاشي وجلاش)', price: '٢٤٥' },
                    { name: 'مكرونه نجرسكو', price: '١٦٥' },
                    { name: 'مكرونه اسباجتي بلونيز / فرن', price: '٩٠' },
                ],
                'الشوربة والخضار': [
                    { name: 'شوربه بهاريز', price: '١٦٠' },
                    { name: 'شوربة كوارع', price: '١١٠' },
                    { name: 'شوربه كريمه فراخ', price: '١١٠' },
                    { name: 'برام خضار باللحمة', price: '٢٣٥' },
                ],
            };

            const categories = Object.keys(menuData);

            return (
                <div className="min-h-screen text-gray-100 pb-28">
                    
                    {/* Header */}
                    <header className="bg-[#1a1a1a] border-b border-amber-600/30 sticky top-0 z-40 shadow-lg shadow-black/50">
                        <div className="container mx-auto px-4 py-6 flex flex-col items-center">
                            <h1 className="text-4xl font-extrabold text-amber-500 mb-2 tracking-tight">الوطنية</h1>
                            <p className="text-md text-gray-400 font-medium tracking-wide">الشرقي على أصوله</p>
                        </div>
                        
                        {/* Navigation Tabs */}
                        <div className="flex overflow-x-auto hide-scrollbar bg-[#121212] border-t border-gray-800">
                            {categories.map((cat) => (
                                <button
                                    key={cat}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`flex-shrink-0 px-6 py-4 text-lg font-semibold transition-colors duration-300 border-b-2 ${
                                        activeCategory === cat
                                            ? 'border-amber-500 text-amber-500'
                                            : 'border-transparent text-gray-400 hover:text-gray-200'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="container mx-auto px-4 py-10 max-w-3xl">
                        <div className="bg-[#1e1e1e] rounded-2xl p-6 md:p-8 shadow-xl border border-gray-800">
                            <h2 className="text-3xl font-bold text-amber-500 mb-8 border-r-4 border-amber-500 pr-4">
                                {activeCategory}
                            </h2>
                            
                            <div className="flex flex-col space-y-6">
                                {menuData[activeCategory].map((item, index) => (
                                    <div key={index} className="flex items-end justify-between group">
                                        <span className="text-lg md:text-xl font-medium text-gray-200 group-hover:text-amber-400 transition-colors">
                                            {item.name}
                                        </span>
                                        <div className="flex-grow border-b-2 border-dotted border-gray-700 mx-4 mb-2 opacity-50"></div>
                                        <span className="text-lg md:text-xl font-bold text-amber-500 whitespace-nowrap">
                                            {item.price} <span className="text-sm text-gray-500">ج.م</span>
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="fixed bottom-0 w-full bg-[#0a0a0a] border-t border-gray-800 z-50 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.5)]">
                        <div className="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
                            <p className="text-gray-400 text-sm font-medium text-center md:text-right">
                                جميع الأسعار يضاف إليها 14% ضريبة القيمة المضافة
                            </p>
                            <div className="flex items-center space-x-3 space-x-reverse text-sm">
                                <span className="text-gray-500">
                                    Developed by <span className="text-gray-300 font-semibold">Ahmed Assaf</span>
                                </span>
                                <span className="text-gray-700">|</span>
                                <a 
                                    href="https://fb.com/a7md3ssaf" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="bg-[#1877F2] hover:bg-[#166FE5] text-white px-4 py-2 rounded-lg font-medium transition-all shadow-lg flex items-center gap-2"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
                                    </svg>
                                    Contact Developer
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MenuApp />);
    </script>
</body>
</html>
