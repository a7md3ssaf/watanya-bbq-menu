<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو | الوطنية للمشويات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خطوط جوجل (كايرو) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #09090b; /* أسود فخم */
        }
        /* إخفاء شريط التمرير (Scrollbar) من شريط الأقسام مع الحفاظ على عمله */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* تأثير النبض الخفيف للأسعار */
        .price-badge:hover {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="antialiased text-slate-200 selection:bg-orange-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const MenuApp = () => {
            const [activeCategory, setActiveCategory] = useState('السلطات');

            const menuData = {
                'السلطات': [
                    { name: 'سلطه خضراء', price: '٢٠' },
                    { name: 'ثوميه / بابا غنوج / زبادي', price: '٢٠' },
                    { name: 'كول سلو / حمص / مايونيز', price: '٢٥' },
                    { name: 'طبق ميكس صغير', price: '٣٠' },
                    { name: 'طبق ميكس كبير', price: '٤٠' },
                    { name: 'جبنه قديمه', price: '٣٠' },
                ],
                'النشويات': [
                    { name: 'أرز بسمتي / أرز كاري', price: '٧٠' },
                    { name: 'أرز بالخلطه / فته ساده', price: '٦٥' },
                    { name: 'أرز ساده', price: '٥٥' },
                    { name: 'برام أرز معمر', price: '٧٠' },
                    { name: 'سوبر (أرز ومحاشي وجلاش)', price: '٩٠' },
                ],
                'المكرونات': [
                    { name: 'مبكبكه لحمه', price: '٢٢٥' },
                    { name: 'مبكبكه سجق', price: '١٨٥' },
                    { name: 'مكرونه وايت صوص + بانيه', price: '٢٥٠' },
                    { name: 'طبق فراخ بانيه (مع أرز ومحاشي وجلاش)', price: '٢٤٥' },
                    { name: 'مكرونه نجرسكو', price: '١٦٥' },
                    { name: 'مكرونه اسباجتي بلونيز / فرن', price: '٩٠' },
                ],
                'الشوربة والخضار': [
                    { name: 'شوربه بهاريز', price: '١٦٠' },
                    { name: 'شوربة كوارع', price: '١١٠' },
                    { name: 'شوربه كريمه فراخ', price: '١١٠' },
                    { name: 'برام خضار باللحمة', price: '٢٣٥' },
                ],
            };

            const categories = Object.keys(menuData);

            return (
                <div className="min-h-screen pb-32 relative">
                    {/* تأثيرات إضاءة في الخلفية */}
                    <div className="fixed top-0 right-0 w-96 h-96 bg-orange-600/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
                    <div className="fixed bottom-0 left-0 w-96 h-96 bg-red-600/10 rounded-full blur-[100px] pointer-events-none z-0"></div>

                    {/* Header: Hero Section */}
                    <header className="relative pt-12 pb-8 px-4 text-center z-10">
                        <div className="inline-block p-1 rounded-2xl bg-gradient-to-br from-orange-500/30 to-red-500/5 mb-4">
                            <div className="bg-[#09090b] rounded-xl px-8 py-4 border border-orange-500/20">
                                <h1 className="text-5xl md:text-6xl font-black bg-clip-text text-transparent bg-gradient-to-r from-orange-400 via-orange-500 to-red-500 mb-2 drop-shadow-sm">
                                    الوطنية
                                </h1>
                                <p className="text-lg md:text-xl text-orange-200/80 font-semibold tracking-widest">
                                    الشرقي على أصوله
                                </p>
                            </div>
                        </div>
                    </header>

                    {/* Sticky Navigation Tabs (Glassmorphism) */}
                    <div className="sticky top-0 z-50 backdrop-blur-md bg-[#09090b]/80 border-y border-white/5 shadow-2xl mb-8">
                        <div className="container mx-auto px-2">
                            <div className="flex overflow-x-auto hide-scrollbar py-4 gap-3 md:justify-center items-center px-4">
                                {categories.map((cat) => (
                                    <button
                                        key={cat}
                                        onClick={() => setActiveCategory(cat)}
                                        className={`flex-shrink-0 px-6 py-2.5 rounded-full text-lg font-bold transition-all duration-300 ${
                                            activeCategory === cat
                                                ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-lg shadow-orange-500/25 scale-105'
                                                : 'bg-white/5 text-slate-400 hover:bg-white/10 hover:text-slate-200'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content: Menu Items */}
                    <main className="container mx-auto px-4 max-w-4xl relative z-10">
                        <div className="bg-[#121214] rounded-3xl p-6 md:p-10 shadow-2xl border border-white/5">
                            
                            {/* Category Title */}
                            <div className="text-center mb-10 flex items-center justify-center gap-4">
                                <div className="h-px bg-gradient-to-l from-orange-500/0 to-orange-500/50 w-12 md:w-24"></div>
                                <h2 className="text-3xl font-black text-white">
                                    {activeCategory}
                                </h2>
                                <div className="h-px bg-gradient-to-r from-orange-500/0 to-orange-500/50 w-12 md:w-24"></div>
                            </div>
                            
                            {/* Items List */}
                            <div className="grid gap-3 md:gap-4">
                                {menuData[activeCategory].map((item, index) => (
                                    <div 
                                        key={index} 
                                        className="flex justify-between items-center p-4 md:p-5 rounded-2xl bg-white/[0.02] hover:bg-white/[0.05] border border-transparent hover:border-orange-500/20 transition-all duration-300 group"
                                    >
                                        <div className="flex-1 pr-2">
                                            <h3 className="text-xl md:text-2xl font-bold text-slate-200 group-hover:text-orange-400 transition-colors">
                                                {item.name}
                                            </h3>
                                        </div>
                                        
                                        <div className="flex-shrink-0 price-badge flex items-baseline gap-1.5 bg-orange-500/10 px-5 py-2.5 rounded-xl border border-orange-500/20 transition-all duration-300">
                                            <span className="text-2xl md:text-3xl font-black text-orange-400">{item.price}</span>
                                            <span className="text-sm md:text-base font-semibold text-orange-400/70">ج.م</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Modern Footer */}
                    <footer className="fixed bottom-0 w-full backdrop-blur-xl bg-[#09090b]/90 border-t border-white/5 z-50">
                        <div className="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <div className="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></div>
                                <p className="text-slate-400 text-sm md:text-base font-semibold">
                                    جميع الأسعار يضاف إليها 14% ضريبة القيمة المضافة
                                </p>
                            </div>
                            
                            <div className="flex items-center gap-3 text-sm md:text-base">
                                <span className="text-slate-500 font-medium">
                                    Developed by <span className="text-slate-200 font-bold tracking-wide">Ahmed Assaf</span>
                                </span>
                                <span className="text-slate-700">|</span>
                                <a 
                                    href="https://fb.com/a7md3ssaf" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="bg-blue-600/10 hover:bg-blue-600 text-blue-500 hover:text-white border border-blue-600/30 hover:border-blue-600 px-4 py-2 rounded-xl font-bold transition-all duration-300 flex items-center gap-2 group"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" className="group-hover:scale-110 transition-transform">
                                        <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
                                    </svg>
                                    Contact Developer
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MenuApp />);
    </script>
</body>
</html>
